  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#1a2342 0%,#0a0e1a 60%);transition:opacity .35s ease;font-family:system-ui,-apple-system,sans-serif;color:#e6ebf5;">
      <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:1.1rem;">
        <div style="position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.28),transparent 70%);filter:blur(6px);animation:sj-glow 2.4s ease-in-out infinite;"></div>
        <img src="/splash-eagle.png" alt="CredMais App" width="120" height="120" style="position:relative;width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 18px 40px rgba(212,175,55,.28));animation:sj-pulse 2.4s ease-in-out infinite;" />
      </div>
      <div style="font-size:1.05rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#f2d98a,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent;">CredMais App</div>
      <div style="margin-top:1.25rem;width:28px;height:28px;border:2.5px solid rgba(212,175,55,.18);border-top-color:#d4af37;border-radius:50%;animation:sj-spin .9s linear infinite;"></div>
      <style>@keyframes sj-spin{to{transform:rotate(360deg)}}@keyframes sj-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes sj-glow{0%,100%{opacity:.55}50%{opacity:1}}</style>
    </div>
    <script>
      (function () {
        var splashRemoved = false;
        window.__SJ_HIDE_SPLASH__ = function () {
          if (splashRemoved) return;
          splashRemoved = true;
          try { sessionStorage.removeItem("__sj_boot_recovering"); } catch (e) {}
          var splash = document.getElementById("app-splash");
          if (!splash) return;
          splash.style.opacity = "0";
          setTimeout(function () { splash.remove(); }, 350);
        };

        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) window.__SJ_HIDE_SPLASH__();
          }, 1200);
        });

        setTimeout(function () {
          var root = document.getElementById("root");
          var splash = document.getElementById("app-splash");
          if (!splash || (root && root.childElementCount > 0)) return;
          var alreadyRecovering = false;
          try { alreadyRecovering = sessionStorage.getItem("__sj_boot_recovering") === "1"; } catch (e) {}
          if (!alreadyRecovering) {
            try { sessionStorage.setItem("__sj_boot_recovering", "1"); } catch (e) {}
            Promise.all([
              window.caches && caches.keys ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); }) : Promise.resolve(),
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); }) : Promise.resolve()
            ]).finally(function () { location.reload(); });
            return;
          }
          splash.innerHTML = '<div style="font-size:1rem;font-weight:700;margin-bottom:.5rem;">Não foi possível carregar</div><div style="font-size:.85rem;color:#aab6d3;margin-bottom:1rem;text-align:center;max-width:300px;">Atualize a página para limpar o cache e tentar novamente.</div><button type="button" style="border:0;border-radius:10px;background:#3b6fc4;color:white;font-weight:700;padding:.75rem 1rem;cursor:pointer;">Atualizar</button>';
          splash.querySelector("button").onclick = function () {
            Promise.all([
              window.caches && caches.keys ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); }) : Promise.resolve(),
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); }) : Promise.resolve()
            ]).finally(function () { location.reload(); });
          };
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
